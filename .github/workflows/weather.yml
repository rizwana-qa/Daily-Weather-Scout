name: Daily weather agent
 
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
 
jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      # Dry run: no Google Sheets write and no email. Switch back to
      # "agent" only after the output has been reviewed.
      - run: python weather_log.py agent-dry
        env:
          SHEET_URL: ${{ secrets.SHEET_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
